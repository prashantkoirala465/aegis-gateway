name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv pip install --system ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv pip install --system ".[dev]"
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_gateway_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_gateway_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aegis_app:aegis_app@localhost:5432/aegis_gateway_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis_gateway_test
      REDIS_URL: redis://localhost:6379/0
      API_KEY_PEPPER: test-pepper-not-for-production
      JWT_SECRET: test-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv pip install --system ".[dev]"
      - run: python -m spacy download en_core_web_sm
      - run: alembic upgrade head
      - run: pytest --cov=aegis_gateway --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv pip install --system pip-audit
      - run: pip-audit --strict -r <(uv pip compile pyproject.toml)

  docker:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
