name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_gateway_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_gateway_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aegis_app:aegis_app@localhost:5432/aegis_gateway_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis_gateway_test
      REDIS_URL: redis://localhost:6379/0
      API_KEY_PEPPER: test-pepper-not-for-production
      JWT_SECRET: test-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=aegis_gateway --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      # uvx runs pip-audit in its own ephemeral, isolated env — no need for this
      # job to manage a venv just to run one CLI tool once.
      #
      # PYSEC-2026-3552/3553/3554 (cryptography 48.0.1): presidio-anonymizer pins
      # cryptography>=48.0.1,<49.0.0 and no patched 48.x release exists upstream, so
      # we can't take the fix without dropping Presidio. None of the three apply to
      # this codebase's usage: they're in PKCS#7 EnvelopedData decryption and X.509
      # chain building/verification, and this project does neither — cryptography is
      # here only as presidio-anonymizer's transitive dependency. Revisit next time
      # presidio-anonymizer bumps its cryptography ceiling.
      - run: >-
          uvx pip-audit --strict -r <(uv pip compile pyproject.toml)
          --ignore-vuln PYSEC-2026-3552
          --ignore-vuln PYSEC-2026-3553
          --ignore-vuln PYSEC-2026-3554

  docker:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
