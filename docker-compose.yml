services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis_gateway
    ports:
      - "5432:5432"
    volumes:
      - aegis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis_app:aegis_app@postgres:5432/aegis_gateway
      MIGRATION_DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis_gateway
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `exec` replaces the shell with uvicorn (PID 1) instead of running it as a shell
    # child — without this, `docker stop`'s SIGTERM hits the shell, which doesn't
    # forward it, so uvicorn never runs its graceful-shutdown path and gets SIGKILLed
    # after the stop timeout instead.
    command: >
      sh -c "alembic upgrade head && exec uvicorn aegis_gateway.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis_app:aegis_app@postgres:5432/aegis_gateway
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # arq's own process model handles SIGTERM directly (no shell wrapper needed here,
    # unlike gateway's migrate-then-serve command) — graceful job drain works as-is.
    command: arq aegis_gateway.workers.settings.WorkerSettings

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aegis_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    # Dashboard JSON lives at docker/grafana/provisioning/dashboards/json/ (nested
    # inside the tree below), not a second bind mount — mounting a second volume at
    # a path *inside* an already-mounted read-only directory fails outright (can't
    # create a mountpoint inside a read-only filesystem).
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - aegis_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  aegis_postgres_data:
  aegis_prometheus_data:
  aegis_grafana_data:
